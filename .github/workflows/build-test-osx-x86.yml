# AUTOGENERATED FROM build-test-osx-x86.jsonnet DO NOT MODIFY
jobs:
  build-core:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        if: ${{ inputs.use-cache}}
        name: Set GHA cache for OPAM in ~/.opam
        uses: actions/cache@v3
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-v1-opam-5.2.1-${{hashFiles('semgrep.opam')}}
          path: ~/.opam
      - name: Install dependencies
        run: ./scripts/osx-setup-for-release.sh "5.2.1"
      - name: Compile semgrep (in case of linking errors, adjust src/main/flags.sh)
        run: opam exec -- make core
      - name: Make artifact for ./bin/opengrep-core
        run: |
          mkdir artifacts
          
          cp ./bin/opengrep-core artifacts/

          pushd artifacts

          BREW_PREFIX=$(brew --prefix)
          
          install_name_tool -change \
            $BREW_PREFIX/opt/zstd/lib/libzstd.1.dylib \
            @loader_path/libzstd.1.dylib \
            opengrep-core

          install_name_tool -change \
            $BREW_PREFIX/opt/gmp/lib/libgmp.10.dylib \
            @loader_path/libgmp.10.dylib \
            opengrep-core
          
          install_name_tool -change \
            $BREW_PREFIX/opt/libev/lib/libev.4.dylib \
            @loader_path/libev.4.dylib \
            opengrep-core

          install_name_tool -change \
            $BREW_PREFIX/opt/pcre2/lib/libpcre2-8.0.dylib \
            @loader_path/libpcre2-8.0.dylib \
            opengrep-core

          install_name_tool -change \
            $BREW_PREFIX/opt/pcre/lib/libpcre.1.dylib \
            @loader_path/libpcre.1.dylib \
            opengrep-core

          install_name_tool -change \
            $GITHUB_WORKSPACE/libs/ocaml-tree-sitter-core/tree-sitter/lib/libtree-sitter.0.dylib \
            @loader_path/libtree-sitter.0.dylib \
            opengrep-core

          install_name_tool -delete_rpath \
            $GITHUB_WORKSPACE/libs/ocaml-tree-sitter-core/tree-sitter/lib \
            opengrep-core
          
          # otool -l opengrep-core
          otool -L opengrep-core | grep -v "^\\s*/usr/lib/"

          cp $BREW_PREFIX/opt/zstd/lib/libzstd.1.dylib . 
          cp $BREW_PREFIX/opt/gmp/lib/libgmp.10.dylib . 
          cp $BREW_PREFIX/opt/libev/lib/libev.4.dylib . 
          cp $BREW_PREFIX/opt/pcre2/lib/libpcre2-8.0.dylib . 
          cp $BREW_PREFIX/opt/pcre/lib/libpcre.1.dylib .
          cp $GITHUB_WORKSPACE/libs/ocaml-tree-sitter-core/tree-sitter/lib/libtree-sitter.0.dylib .

          popd
          tar czf artifacts.tgz artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: opengrep-osx-x86
          path: artifacts.tgz
  build-wheels:
    needs:
      - build-core
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: opengrep-osx-x86
      - run: |
          tar xvfz artifacts.tgz
          cp artifacts/* cli/src/semgrep/bin
          ./scripts/build-wheels.sh --plat-name macosx_10_14_x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: osx-x86-wheel
          path: cli/dist.zip
  test-wheels:
    needs:
      - build-wheels
    runs-on: macos-13
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: osx-x86-wheel
      - run: unzip dist.zip
      - name: install package
        run: pip3 install dist/*.whl
      - run: opengrep --version
      - name: e2e opengrep-core test
        run: echo '1 == 1' | opengrep -l python -e '$X == $X' -
      - name: test dynamically linked libraries are in /usr/lib/
        run: |
          otool -L $(opengrep --dump-engine-path) | tee otool.txt
          if [ $? -ne 0 ]; then
             echo "Failed to list dynamically linked libraries.";
             exit 1;
          fi
          NON_USR_LIB_DYNAMIC_LIBRARIES=$(tail -n +2 otool.txt | grep -v "^\\s*/usr/lib/")
          if [ $? -eq 0 ]; then
             echo "Error: opengrep-core has been dynamically linked against libraries outside /usr/lib:"
             echo $NON_USR_LIB_DYNAMIC_LIBRARIES
             exit 1;
          fi;
        shell: bash {0}
name: build-test-osx-x86
on:
  workflow_call:
    inputs:
      use-cache:
        default: true
        description: Use Opam Cache - uncheck the box to disable use of the opam cache, meaning a long-running but completely from-scratch build.
        required: false
        type: boolean
  workflow_dispatch:
    inputs:
      use-cache:
        default: true
        description: Use Opam Cache - uncheck the box to disable use of the opam cache, meaning a long-running but completely from-scratch build.
        required: true
        type: boolean
